# ==============================================================================
# Shared Base Configuration for All Services
# ==============================================================================
# This file contains common configuration shared across all services.
# Individual services extend this configuration and add their specific settings.
# ==============================================================================

# ------------------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------------------

plugins:
  - serverless-offline

# ------------------------------------------------------------------------------
# Parameters
# ------------------------------------------------------------------------------
params:
  local:
    logLevel: TRACE
    logEvent: true
  dev:
    logLevel: DEBUG
    logEvent: false
  prod:
    logLevel: INFO
    logEvent: false
  default:
    logLevel: DEBUG
    logEvent: false

# ------------------------------------------------------------------------------
# Provider Configuration
# ------------------------------------------------------------------------------

provider:
  name: aws
  runtime: nodejs20.x
  # stage: ${sls:stage}
  region: eu-central-1
  memorySize: 512 # Default memory size for functions (MB). Must be greater than 128
  timeout: 29 # Default timeout for functions (seconds). HTTP API limit is 30s.

  # Enable X-Ray tracing
  tracing:
    lambda: true
    apiGateway: true

  # Global Layers
  layers:
    - arn:aws:lambda:eu-central-1:901920570463:layer:aws-otel-nodejs-amd64-ver-1-30-1:1

  # CloudWatch Logs configuration
  logs:
    lambda:
      logFormat: JSON
      applicationLogLevel: ${param:logLevel}
      systemLogLevel: WARN
      logGroup: /aws/lambda/${self:service}-${sls:stage}

  # Global Environment Variables
  environment:
    # AWS Powertools configuration
    POWERTOOLS_SERVICE_NAME: ${self:service}
    POWERTOOLS_LOG_LEVEL: ${param:logLevel}
    POWERTOOLS_LOGGER_LOG_EVENT: ${param:logEvent}

    # OpenTelemetry Configuration
    AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-handler
    OTEL_SERVICE_NAME: ${self:service}
    OTEL_TRACES_SAMPLER: always_on
    OTEL_PROPAGATORS: xray,tracecontext,baggage,xray-lambda

    # Optimization to reduce cold start overhead
    OTEL_NODE_ENABLED_INSTRUMENTATIONS: aws-lambda,aws-sdk,http,https,fetch

    # Reduce OpenTelemetry logs
    OPENTELEMETRY_EXTENSION_LOG_LEVEL: error

    # Disable Node's experimental warnings
    NODE_NO_WARNINGS: "1"

    # Disable AWS callback handler warning
    AWS_LAMBDA_NODEJS_DISABLE_CALLBACK_WARNING: "1"
    # BOOKS_TABLE_NAME: !Ref BooksTable
