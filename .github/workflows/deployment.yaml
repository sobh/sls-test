name: 🚀 Deployment

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      services:
        description: "🛒 Services to deploy (space separated)"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
    env:
      STAGE: ${{ github.ref_name == 'prod' && 'prod' || 'dev' }}
      AWS_REGION: ${{ secrets.REGION }}

    steps:
      # ---- Checkout Code -----------------------------------------------------
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      # ---- Service Selection -------------------------------------------------
      - name: 🧬 Detecting Services Changes (superseded by the Dispatcher Input)
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.services }}" ]; then
            services="${{ github.event.inputs.services }}"
            echo "⚠️ Service Change Detection is Overridden by the Dispatcher Input"
          else
            git fetch origin ${{ github.event.before }} --depth=1
            services=$(
              git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
              | awk -F/ '$0 ~ "src/apps" {print $3}' \
              | sort -u \
              | tr '\n' ' '
            )
          fi

          if [[ -z "$services" ]]; then
            echo "🚫 No apps to deploy"
            exit 1
          fi

          echo "🛒 Selected Services: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

      # ---- Setup -------------------------------------------------------------
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      # The Lambda Core Dependency Artifact is always on the dev account
      - name: 🔐🏺 Configure AWS Credentials (Code Artifact)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.CODEARTIFACT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CODEARTIFACT_SECRET_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: 📦 Install NPM Dependencies
        run: |
          # npm run co:login
          npm ci --include=dev

      # ---- Deployment --------------------------------------------------------
      - name: 🔐🏗️ Configure AWS Credentials (Deployment)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ env.STAGE == 'prod' && secrets.PROD_ACCESS_KEY || secrets.DEV_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.STAGE == 'prod' && secrets.PROD_SECRET_KEY || secrets.DEV_SECRET_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: 🚀 Deploy Lambda Services
        id: deploy
        shell: bash
        run: |
          status="✅ Successful Deployment"
          result=""
          exit_status=0

          echo "🛒 Selected Services: ${{ steps.detect.outputs.services }}"

          for service in ${{ steps.detect.outputs.services }}; do
            echo "🚀 Deploying the `$service` service"
            sls_out=$(
              npx sls deploy \
              --service="$service" \
              --stage=${{ env.STAGE }} 1>/dev/null
            )
            echo "$sls_out"

            if echo "$sls_out" | grep -q "No changes to deploy"; then
              result+=$(printf "\t⚠️ $service skipped\n")
            elif echo "$sls_out" | grep -q "Exit code: 0"; then
              result+=$(printf "\t✅ $service deployed\n")
            else
              result+=$(printf "\t❌ $service failed\n")
              status="❌ One, or more services failed the Deployment"
              exit_status=1
            fi
          done

          echo "📝 Deployment Status: $status"
          echo "$result"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit $exit_status

      # ---- AWS SNS Notification ----------------------------------------------
      - name: 🔐🔔 Configure AWS Credentials (SNS)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.PROD_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.PROD_SECRET_KEY }}
          aws-region: ${{ secrets.REGION }}

      - name: 📢 AWS Publish Deployment Notifications
        env:
          TOPIC_ARN: ${{ secrets.TOPIC_ARN }}
        run: |
          cat << EOF > file.txt
          **🏗️ Environment**: ${{ env.STAGE }}

          **📊 Status**: ${{ steps.deploy.outputs.status }}

          **📝 Summary**:
          ${{ steps.deploy.outputs.result }}

          **🎯 Deployment Target**: ${{ github.ref }}
          **🔫 Triggered By**:      ${{ github.actor }}
          **Event Type**:           ${{ github.event_name }}
          **🪪 Commit ID**:         ${{ github.sha }}
          **💬 Commit Message**:    ${{ github.event.head_commit.message }}
          **🔢 Build Number**:      ${{ github.run_number }}
          **🪣 Repository**:        ${{ github.repository }}

          More info at: https://github.com/${{ github.repository }}/commit/${{ github.sha }}/checks
          EOF

          aws sns publish \
            --topic-arn $TOPIC_ARN \
            --message file://file.txt \
            --subject "GitHub Actions Build: ${{ github.repository }} ${{ env.STAGE }} "
