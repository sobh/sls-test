# ==============================================================================
# Serverless Service Configuration
# ==============================================================================
service: book-api
frameworkVersion: "4"

# ------------------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------------------
plugins:
  - serverless-offline # Allows running the service locally

# ------------------------------------------------------------------------------
# Build
# ------------------------------------------------------------------------------
build:
  esbuild:
    banner:
      js: 'import { createRequire } from "module"; import { fileURLToPath } from "url"; import { dirname } from "path"; const require = createRequire(import.meta.url); const __filename = fileURLToPath(import.meta.url); const __dirname = dirname(__filename);'

# ------------------------------------------------------------------------------
# Custom Variables
# ------------------------------------------------------------------------------
custom:
  stage:
    local:
      log:
        level: TRACE
        event: true
    dev:
      log:
        level: DEBUG
        event: false
    prod:
      log:
        level: INFO
        event: false
  # DynamoDB Table configurations
  tables:
    books:
      name: BooksTable

# ------------------------------------------------------------------------------
# Provider Configuration
# ------------------------------------------------------------------------------
provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'} # Default to 'dev' if not specified
  region: eu-central-1
  memorySize: 128 # Default memory size for functions (MB). Must be greater than 128
  timeout: 29 # Default timeout for functions (seconds). HTTP API limit is 30s.

  # Enable X-Ray tracing
  tracing:
    lambda: true
    apiGateway: true

  # CloudWatch Logs configuration
  logs:
    lambda:
      logFormat: JSON
      applicationLogLevel: ${self:custom.stage.${sls:stage}.log.level, 'DEBUG'}
      systemLogLevel: WARN
      logGroup: /aws/lambda/${self:service}-${sls:stage}

  # Global Environment Variables
  environment:
    BOOKS_TABLE_NAME: !Ref BooksTable
    # AWS Powertools configuration
    POWERTOOLS_LOG_LEVEL: ${self:custom.stage.${sls:stage}.log.level, 'DEBUG'}
    POWERTOOLS_SERVICE_NAME: ${self:service}
    POWERTOOLS_LOGGER_LOG_EVENT: ${self:custom.stage.${sls:stage}.log.event, 'false'}

# ------------------------------------------------------------------------------
# Functions
# ------------------------------------------------------------------------------
functions:
  # -- Books API ---------------------------------------------------------------
  listBooks:
    handler: app/handlers/books/listBooks.handler
    description: List all books from DB
    events:
      - httpApi:
          path: /books
          method: get
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Scan
          - dynamodb:Query
        Resource: !GetAtt BooksTable.Arn

  createBook:
    handler: app/handlers/books/createBook.handler
    description: Create a new book on the DB
    events:
      - httpApi:
          path: /books
          method: post
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource: !GetAtt BooksTable.Arn

  getBook:
    handler: app/handlers/books/getBook.handler
    description: Get a book by ID
    events:
      - httpApi:
          path: /books/{bookId}
          method: get
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource: !GetAtt BooksTable.Arn

  updateBook:
    handler: app/handlers/books/updateBook.handler
    description: Update a book by ID
    events:
      - httpApi:
          path: /books/{bookId}
          method: put
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
        Resource: !GetAtt BooksTable.Arn

  deleteBook:
    handler: app/handlers/books/deleteBook.handler
    description: Delete a book by ID
    events:
      - httpApi:
          path: /books/{bookId}
          method: delete
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:DeleteItem
        Resource: !GetAtt BooksTable.Arn

  # -- Test Handlers -----------------------------------------------------------
  testEcho:
    handler: app/handlers/tests/testEcho.handler
    description: Test Echo
    events:
      - httpApi:
          path: /tests/echo
          method: post

  testExternalCall:
    handler: app/handlers/tests/testExternalCall.handler
    description: Test External Call
    events:
      - httpApi:
          path: /tests/calls/external
          method: get

  testInternalCall:
    handler: app/handlers/tests/testInternalCall.handler
    description: Test Internal Call
    events:
      - httpApi:
          path: /tests/calls/internal/{id}
          method: get

  testInternalTracedCall:
    handler: app/handlers/tests/testInternalTracedCall.handler
    description: Test Internal Traced Call
    events:
      - httpApi:
          path: /tests/calls/internal/traced/{id}
          method: get

  testError:
    handler: app/handlers/tests/testError.handler
    description: Test Error
    events:
      - httpApi:
          path: /tests/error
          method: get

# ------------------------------------------------------------------------------
# Resources (CloudFormation)
# ------------------------------------------------------------------------------
resources:
  Resources:
    BooksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.books.name}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
